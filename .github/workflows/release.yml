name: release

# Runs only when a maintainer pushes a v* tag. Signing is keyless (GitHub OIDC); no stored secrets.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # draft GitHub release and its assets
      packages: write # push to ghcr.io
      id-token: write # cosign keyless signing and attestations
      attestations: write # store provenance attestations
      artifact-metadata: write # artifact storage record for actions/attest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: false # never restore a cache into a release build
          install_args: go goreleaser syft cosign jq go:github.com/google/go-licenses/v2
      # Multi-platform manifests with attestations need the docker-container driver.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: mise run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - id: image
        run: echo "digest=$(sh scripts/image-digest.sh "ghcr.io/byward-dev/byward:${GITHUB_REF_NAME}")" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/byward-dev/byward
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
