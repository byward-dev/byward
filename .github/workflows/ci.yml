name: ci

on:
  push:
    # release/**: the exact commit a tag is cut from gets a run of its own after the squash merge
    # (a push reads this file from the pushed ref, so each live release branch carries it too).
    # zizmor reads a release/** push as a release workflow and flags mise's tool cache
    # (cache-poisoning, ignored for this file in .github/zizmor.yml). This workflow publishes nothing, and
    # its caches cannot be poisoned from a pull request: GitHub scopes a pull_request run's cache to
    # its merge ref, and a push run restores only its own branch's and main's caches
    # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching). release.yml,
    # which publishes, runs with cache: false.
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          # Only the tools `check` needs; operator tools such as azure-cli stay out of CI.
          install_args: go golangci-lint go:golang.org/x/tools/cmd/goimports actionlint zizmor shellcheck jq go:github.com/google/go-licenses/v2 go:golang.org/x/vuln/cmd/govulncheck
      # Identifiers and names that must never appear in this repository (ADR-0024 §13): a secret,
      # so it is redacted in the log; each entry is masked too. Fork PRs get no secrets, and the
      # privacy test then checks only email addresses.
      - name: Mask the forbidden identifiers
        env:
          FORBIDDEN: ${{ secrets.BYWARD_FORBIDDEN_IDENTIFIERS }}
        run: |
          printf '%s\n' "$FORBIDDEN" | while IFS= read -r entry; do
            entry=$(printf '%s' "$entry" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$entry" ]; then echo "::add-mask::$entry"; fi
          done
      - run: mise run check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          BYWARD_FORBIDDEN_IDENTIFIERS: ${{ secrets.BYWARD_FORBIDDEN_IDENTIFIERS }}

  # Builds every release artifact exactly as a release would, without signing or publishing (ADR-0019).
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go goreleaser syft jq go:github.com/google/go-licenses/v2
      # Same buildx driver (docker-container) as release.yml, so the snapshot builds images the same way.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runner is amd64: QEMU runs the arm64 image, so release:smoke checks both (#311).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          # The action pulls binfmt's latest unless told: pinned, as every image here is.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - run: mise run release:smoke
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # MCP conformance through --insecure-no-auth must equal conformance against the reference server (ADR-0024 §4a).
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go jq
      - run: mise run test:conformance
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            build/conformance/results
            build/conformance/*.log
          retention-days: 7

  # Identity assertion contract: the TypeScript SDK's and FastMCP's verifiers accept the proxy's
  # assertion and refuse a wrong audience, an expired one and another key (ADR-0016 §8).
  assertion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - run: mise run test:assertion
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # Consent and error pages in Chromium: Playwright and axe (ADR-0010, ADR-0024); screenshots kept for review.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - run: mise run test:ui
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: |
            build/ui/screenshots
            build/ui/test-results
            build/ui/*.log
          retention-days: 7

  # Go tests behind the integration build tag, such as the restore drill (ADR-0007 §9, ADR-0024).
  integration-go:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      # The pinned MCP conformance CLI, for its `authorization` suite against the broker (ADR-0024 §4b).
      - run: mise run test:conformance:install
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run test:integration:go
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          # The real open-source clients run in pinned containers on the host network (ADR-0024 §3).
          BYWARD_REAL_CLIENTS: "1"

  # The PostgreSQL store adapter on PostgreSQL 15 and 18 in pinned containers with TLS: the
  # conformance suite and the adapter's own tests (ADR-0007 §2, amended for #227).
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go
      - run: mise run test:postgres
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
