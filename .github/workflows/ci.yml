name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Only the tools `check` needs; operator tools such as azure-cli stay out of CI.
          install_args: go golangci-lint go:golang.org/x/tools/cmd/goimports actionlint zizmor shellcheck jq go:github.com/google/go-licenses/v2 go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # Builds every release artifact exactly as a release would, without signing or publishing (ADR-0019).
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go goreleaser syft jq go:github.com/google/go-licenses/v2
      # Same buildx driver (docker-container) as release.yml, so the snapshot builds images the same way.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - run: mise run release:smoke
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # MCP conformance through --insecure-no-auth must equal conformance against the reference server (ADR-0024 §4a).
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go jq
      - run: mise run test:conformance
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            build/conformance/results
            build/conformance/*.log
          retention-days: 7

  # Consent and error pages in Chromium: Playwright and axe (ADR-0010, ADR-0024); screenshots kept for review.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go
      - run: mise run test:ui
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: |
            build/ui/screenshots
            build/ui/test-results
            build/ui/*.log
          retention-days: 7

  # Go tests behind the integration build tag, such as the restore drill (ADR-0007 §9, ADR-0024).
  integration-go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: go
      - run: mise run test:integration:go
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
