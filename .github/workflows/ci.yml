name: ci

on:
  push:
    # release/**: the exact commit a tag is cut from gets a run of its own after the squash merge
    # (a push reads this file from the pushed ref, so each live release branch carries it too).
    # zizmor reads a release/** push as a release workflow and flags mise's tool cache
    # (cache-poisoning, ignored for this file in .github/zizmor.yml). This workflow publishes nothing, and
    # its caches cannot be poisoned from a pull request: GitHub scopes a pull_request run's cache to
    # its merge ref, and a push run restores only its own branch's and main's caches
    # (docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching). release.yml,
    # which publishes, runs with cache: false.
    branches: [main, "release/**"]
  pull_request:
  # The merge queue: a required check that does not run on merge_group is never reported there,
  # and the queue fails (docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/configuring-pull-request-merges/managing-a-merge-queue).
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `mise run check` split into parallel jobs, each running the same mise tasks (mise.toml
  # tasks.check lists them); `check` below is the required check and passes only if all of them do.
  # The jobs install only the tools their tasks need; operator tools such as azure-cli stay out of CI.
  # The Go jobs cache Go's build and module caches (and lint golangci-lint's) per job, keyed on the
  # toolchain (mise.toml), the modules (go.sum) and the lint config. The cache-poisoning note at the
  # top covers them: a pull_request run's cache is scoped to its merge ref.

  # Whether the change is docs-only (scripts/ci-docs-only.sh): then the expensive jobs below are
  # skipped with `if:`. `test` always runs in full: many Go tests read the docs (links, anchors, the
  # generated references, settings.md, guides a message names), and Go's test cache re-runs every
  # test whose opened files or directories changed, so no list of them is kept. Skipping by `if:`, not
  # by a `paths` filter: a job skipped by `if:` reports success, while a workflow skipped by a path
  # filter leaves its required checks pending and blocks the merge
  # (docs.github.com/en/repositories/configuring-branches-and-merges-in-your-repository/managing-protected-branches/troubleshooting-required-status-checks).
  # A push (main, release/**) has no base here, so it always runs everything; so does any run this
  # job cannot classify, or in which it fails (the jobs use !cancelled(), not success()).
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the diff needs the merge base of base and head
          persist-credentials: false
      # The merge_group payload holds base_sha, base_ref, head_sha, head_ref and head_commit (seen in
      # the queue run of #434); logged so a change in it shows.
      - name: Show the merge group payload's fields
        if: ${{ github.event_name == 'merge_group' }}
        env:
          MERGE_GROUP: ${{ toJSON(github.event.merge_group) }}
        run: |
          printf '%s\n' "$MERGE_GROUP" | jq '{base_sha, head_sha, base_ref, head_ref, keys: keys}'
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: sh scripts/ci-docs-only.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  fmt-vet:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go go:golang.org/x/tools/cmd/goimports
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-
      - run: mise run fmt:check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run vet
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go golangci-lint
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
            ~/.cache/golangci-lint
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum', '.golangci.yml') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-
      - run: mise run lint
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  vuln-licenses:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go go:github.com/google/go-licenses/v2 go:golang.org/x/vuln/cmd/govulncheck
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-
      - run: mise run vuln
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run licenses:check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.job }}-${{ runner.os }}-${{ hashFiles('mise.toml', 'go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-
      # Identifiers and names that must never appear in this repository (ADR-0024 §13): a secret,
      # so it is redacted in the log; each entry is masked too. Fork PRs get no secrets, and the
      # privacy test then checks only email addresses.
      - name: Mask the forbidden identifiers
        env:
          FORBIDDEN: ${{ secrets.BYWARD_FORBIDDEN_IDENTIFIERS }}
        run: |
          printf '%s\n' "$FORBIDDEN" | while IFS= read -r entry; do
            entry=$(printf '%s' "$entry" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if [ -n "$entry" ]; then echo "::add-mask::$entry"; fi
          done
      - run: mise run test
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          BYWARD_FORBIDDEN_IDENTIFIERS: ${{ secrets.BYWARD_FORBIDDEN_IDENTIFIERS }}

  scripts-docs-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go jq actionlint zizmor shellcheck
      - run: mise run test:scripts
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run lint:docs
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run lint:workflows
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # The required check (ruleset protect-main): its name must stay `check`. It runs even when a job
  # above fails or is cancelled, because a skipped required check counts as passed. A skipped part
  # passes only when `changes` succeeded and said docs-only.
  check:
    if: ${{ always() }}
    needs: [changes, fmt-vet, lint, vuln-licenses, test, scripts-docs-workflows]
    runs-on: ubuntu-latest
    steps:
      - name: Every part of the check passed
        env:
          CHANGES: ${{ needs.changes.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if [ "$CHANGES" != success ]; then echo "changes ended: $CHANGES"; exit 1; fi
          for r in $RESULTS; do
            case $r in
              success) ;;
              skipped) if [ "$DOCS_ONLY" != true ]; then echo "a check job was skipped, but the change is not docs-only ($RESULTS)"; exit 1; fi ;;
              *) echo "a check job ended: $r ($RESULTS)"; exit 1 ;;
            esac
          done

  # Builds every release artifact exactly as a release would, without signing or publishing (ADR-0019).
  release-snapshot:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # goreleaser reads tags
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go goreleaser syft jq go:github.com/google/go-licenses/v2
      # Same buildx driver (docker-container) as release.yml, so the snapshot builds images the same way.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The runner is amd64: QEMU runs the arm64 image, so release:smoke checks both (#311).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
          # The action pulls binfmt's latest unless told: pinned, as every image here is.
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - run: mise run release:smoke
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # MCP conformance through --insecure-no-auth must equal conformance against the reference server (ADR-0024 §4a).
  conformance:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go jq
      - run: mise run test:conformance
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-results
          path: |
            build/conformance/results
            build/conformance/*.log
          retention-days: 7

  # Identity assertion contract: the TypeScript SDK's and FastMCP's verifiers accept the proxy's
  # assertion and refuse a wrong audience, an expired one and another key (ADR-0016 §8).
  assertion:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go
      - run: mise run test:assertion
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"

  # Consent and error pages in Chromium: Playwright and axe (ADR-0010, ADR-0024); screenshots kept for review.
  ui:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go
      - run: mise run test:ui
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: |
            build/ui/screenshots
            build/ui/test-results
            build/ui/*.log
          retention-days: 7

  # Go tests behind the integration build tag, such as the restore drill (ADR-0007 §9, ADR-0024).
  integration-go:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go
      # The pinned MCP conformance CLI, for its `authorization` suite against the broker (ADR-0024 §4b).
      - run: mise run test:conformance:install
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
      - run: mise run test:integration:go
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
          # The real open-source clients run in pinned containers on the host network (ADR-0024 §3).
          BYWARD_REAL_CLIENTS: "1"

  # The PostgreSQL store on PostgreSQL 15 and 18 in pinned containers with TLS: the conformance
  # suite, the adapter's own tests, two replicas of the wired proxy sharing it (ADR-0007, #227), and
  # the operator commands on it (L152).
  postgres:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs-only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: go
      - run: mise run test:postgres
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
