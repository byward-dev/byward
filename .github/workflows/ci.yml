name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # Only the tools `check` needs; operator tools such as azure-cli stay out of CI.
          install_args: go golangci-lint go:golang.org/x/tools/cmd/goimports
      - run: mise run check
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
