name: scorecard

# Publishes OpenSSF Scorecard results (badge in README). The Scorecard API rejects results unless this
# workflow follows https://github.com/ossf/scorecard-action#workflow-restrictions: push/schedule on the
# default branch only, no top-level env or defaults, no workflow-level write permissions, id-token only
# in this job, no run steps, and only the approved actions.
on:
  schedule:
    - cron: "41 5 * * 2"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # sign the published results (scorecard-action requires it for publish_results)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # v2.5.0 only warns when the API rejects results; fail_on_publish_error is unreleased (main, 2026-11-01).
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
