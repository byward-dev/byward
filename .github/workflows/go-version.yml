name: pin-freshness

# Dependabot cannot bump the Go pin in mise.toml, nor the test-lane pins that must move together
# (the Playwright image with @playwright/test, the conformance Node image); this flags newer
# releases of both weekly. It also reruns govulncheck, so a new advisory surfaces without a PR.
on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # curl and jq come with the ubuntu-latest image; no Go or mise needed.
      - run: sh scripts/go-version-check.sh
  test-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/test-pins-check.sh
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: go go:golang.org/x/vuln/cmd/govulncheck
      - run: mise run vuln
        env:
          MISE_TASK_RUN_AUTO_INSTALL: "false"
