version: 2
updates:
  # The distroless base digest (ADR-0019).
  - package-ecosystem: docker
    directories: ["/", "/docs/examples/stdio-node"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  # The real open-source MCP clients of the integration lane (ADR-0024 §3), and the identity
  # assertion verifiers the docs show (scripts/assertion/run.sh), so they stay current.
  - package-ecosystem: npm
    directories: ["/internal/server/testdata/realclients/ts", "/internal/server/testdata/realclients/inspector", "/scripts/assertion/ts"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
  - package-ecosystem: pip
    directories: ["/internal/server/testdata/realclients/python", "/scripts/assertion/py"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
