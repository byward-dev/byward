# Release build (ADR-0019). Local, unsigned, unpublished: `mise run release:snapshot`.
# Real releases run only from .github/workflows/release.yml on a `v*` tag.
version: 2
project_name: mcp-authproxy

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot.{{ .ShortCommit }}"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"

builds:
  - id: mcp-authproxy
    main: ./cmd/mcp-authproxy
    binary: mcp-authproxy
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin] # darwin is for development only
    goarch: [amd64, arm64]
    flags: [-trimpath, -buildvcs=true]
    # Version info comes from runtime/debug.ReadBuildInfo, never -X; setting ldflags replaces goreleaser's -X defaults.
    ldflags: [-s -w]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: mcp-authproxy
    ids: [mcp-authproxy]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    builds_info: &fileinfo
      owner: root
      group: root
      mtime: "{{ .CommitDate }}"
    files:
      - src: LICENSE
        info: *fileinfo
      - src: NOTICE
        info: *fileinfo
      - src: README.md
        info: *fileinfo
      - src: build/licenses
        dst: third_party
        info: *fileinfo

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

# Keyless (GitHub OIDC); release.yml only. Snapshots pass --skip=sign.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]

docker_signs:
  - cmd: cosign
    args: [sign, "${artifact}@${digest}", --yes]

dockers_v2:
  - id: image
    ids: [mcp-authproxy]
    images: [ghcr.io/corker/mcp-authproxy]
    # Snapshots are tagged snapshot-<arch> and only loaded locally (scripts/image-smoke.sh relies on it).
    tags:
      - "{{ if .IsSnapshot }}snapshot{{ else }}v{{ .Version }}{{ end }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms: [linux/amd64, linux/arm64]
    extra_files: [LICENSE, NOTICE, build/licenses]
    build_args:
      SOURCE_DATE_EPOCH: "{{ .CommitTimestamp }}"
    labels:
      org.opencontainers.image.source: https://github.com/corker/mcp-authproxy
      org.opencontainers.image.licenses: Apache-2.0
    annotations:
      "index,manifest:org.opencontainers.image.title": "{{ .ProjectName }}"
      "index,manifest:org.opencontainers.image.description": Auth-only proxy that puts an MCP server behind OAuth 2.1 / OIDC
      "index,manifest:org.opencontainers.image.source": https://github.com/corker/mcp-authproxy
      "index,manifest:org.opencontainers.image.revision": "{{ .FullCommit }}"
      "index,manifest:org.opencontainers.image.version": "{{ .Version }}"
      "index,manifest:org.opencontainers.image.created": "{{ .CommitDate }}"
      "index,manifest:org.opencontainers.image.licenses": Apache-2.0
      "index,manifest:org.opencontainers.image.base.name": "{{ .BaseImage }}"
      "index,manifest:org.opencontainers.image.base.digest": "{{ .BaseImageDigest }}"
    sbom: true
    flags:
      - "{{ if not .IsSnapshot }}--provenance=mode=max{{ end }}"

release:
  draft: true

changelog:
  use: github
